services:
  api-web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 80
    expose:
      - "80"
    environment:
      - REDIS_URL=redis://fila-redis:6379/0
    restart: always
    depends_on:
      - fila-redis
    volumes:
      - dados_pdfs:/app/uploads

  processador-worker:
    build: .
    command: celery -A worker.app_celery worker --loglevel=info
    environment:
      - REDIS_URL=redis://fila-redis:6379/0
    restart: always
    depends_on:
      - fila-redis
    volumes:
      - dados_pdfs:/app/uploads

  fila-redis:
    image: redis:alpine
    restart: always

volumes:
  dados_pdfs:
